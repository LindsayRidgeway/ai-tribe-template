name: pickleball

# Play pickleball from the Play tab: a person's seat, three members, and the whole thing kept in the record.
#
# The engine is `lab/pickleball.py` and the app is a browser with no server behind it, so this is the same shape as
# tennis's `season.yml` and golf's `golf.yml` — one pattern, not three. What is different is the sport: four seats,
# one typed movement, and a screen whose control is the court rather than three numbers (page §5q).
#
# What it will and will not promise. The ball is the engine's, the double bounce and the kitchen are the engine's,
# and the score is the engine's; the movement is the person's, and it is played on every ball that comes to them,
# because a runner cannot stop mid-rally to ask. The serve is the exception the engine makes on the person's behalf:
# a movement that is a fine dink cannot carry thirty feet into the diagonal box, so the serve is played at the pace
# the box requires (§5v). Every other shot is the movement the person typed, at the pace they typed it.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "the season's folder name — reuse it every evening to keep the record going"
        required: true
        default: "2026-winter"
      person:
        description: "a person's seat: your name on the court"
        required: true
        default: ""
      players:
        description: "three members, comma-separated — your partner first. Leave blank for the first three on the shelf"
        required: false
        default: ""
      shot:
        description: "the movement you play every ball, e.g. PACE 24 AT 26,6 (pace in mph, then x,then y in feet)"
        required: true
        default: "PACE 24 AT 26,6"
      games:
        description: "games to 11 (one is a few minutes; three is a set)"
        required: true
        default: "1"
      clock:
        description: "pin the wind to a millisecond count, so the same game can be played again — blank is now"
        required: false
        default: ""
      then_now:
        description: "watch: 'yes' films the same game twice — your hands coming into this season and your hands now — instead of playing a session"
        required: false
        default: ""
      surface:
        description: "the court"
        type: choice
        options:
          - hard
          - clay
          - grass
        default: "hard"

permissions:
  contents: write

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pickleball
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Work from the branch as it is now
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME:-main}"
          git fetch --depth=1 origin "$ref"
          git reset --hard "origin/$ref"

      - name: Which four seats
        env:
          SEASON: ${{ inputs.season }}
          PERSON: ${{ inputs.person }}
          PLAYERS: ${{ inputs.players }}
          SHOT: ${{ inputs.shot }}
          THEN_NOW: ${{ inputs.then_now }}
        run: |
          set -euo pipefail
          case "$SEASON" in
            *[!A-Za-z0-9._-]*) echo "::error::season names are one word: letters, digits, dot, dash"; exit 2 ;;
          esac
          if [ -z "$PERSON" ]; then
            echo "::error::a person's seat needs a name — fill in 'person'"; exit 2
          fi
          # A watch run plays no movement of yours, so it is not asked for one; a session is.
          if [ "$THEN_NOW" != "yes" ]; then
            case "$SHOT" in
              PACE*) : ;;
              *) echo "::error::the movement is a movement, not a wish: PACE 24 AT 26,6"; exit 2 ;;
            esac
          fi
          who="${PLAYERS:-}"
          if [ -z "$who" ]; then
            # The shelf, minus the bench's fixtures, in the order lab/members.py publishes it. `awk`, not `head`,
            # and the `[ -f ]` guard: `head` closes the pipe, `ls` takes a SIGPIPE, and `pipefail` turns it into a
            # silent exit 141 — measured in season.yml on 2026-11-13 and not re-learned here.
            who="$(ls -1 wake/members | while read -r m; do
                     { [ -f lab/fixtures.txt ] && grep -qx "$m" lab/fixtures.txt; } || echo "$m"
                   done | awk 'NR<=3' | paste -sd, -)"
            echo "no members named, so the first three on the shelf play: $who"
          fi
          n="$(printf '%s' "$who" | awk -F, '{print NF}')"
          if [ "$n" -ne 3 ]; then
            echo "::error::pickleball doubles is three members beside and across from you — got '$who'"; exit 2
          fi
          for p in $(printf '%s' "$who" | tr ',' ' '); do
            [ -d "wake/members/$p/state" ] || { echo "::error::no such member: $p"; exit 2; }
          done
          echo "NAMES=$PERSON,$who" >> "$GITHUB_ENV"
          echo "the four seats: $PERSON,$who"

      - name: Play
        env:
          SEASON: ${{ inputs.season }}
          PERSON: ${{ inputs.person }}
          THEN_NOW: ${{ inputs.then_now }}
          SHOT: ${{ inputs.shot }}
          GAMES: ${{ inputs.games }}
          CLOCK: ${{ inputs.clock }}
          SURFACE: ${{ inputs.surface }}
          TRIBE_API_KEY_DEEPSEEK: ${{ secrets.TRIBE_API_KEY_DEEPSEEK }}
          TRIBE_API_KEY_GEMINI: ${{ secrets.TRIBE_API_KEY_GEMINI }}
          TRIBE_API_KEY_QWEN: ${{ secrets.TRIBE_API_KEY_QWEN }}
          TRIBE_API_KEY_OPENAI: ${{ secrets.TRIBE_API_KEY_OPENAI }}
          TRIBE_API_KEY_GROQ: ${{ secrets.TRIBE_API_KEY_GROQ }}
          TRIBE_API_KEY_OPENROUTER: ${{ secrets.TRIBE_API_KEY_OPENROUTER }}
          TRIBE_API_KEY_CEREBRAS: ${{ secrets.TRIBE_API_KEY_CEREBRAS }}
          TRIBE_API_KEY_MISTRAL: ${{ secrets.TRIBE_API_KEY_MISTRAL }}
          TRIBE_API_KEY_TOGETHER: ${{ secrets.TRIBE_API_KEY_TOGETHER }}
          TRIBE_API_KEY_ANTHROPIC: ${{ secrets.TRIBE_API_KEY_ANTHROPIC }}
          TRIBE_API_KEY_ALIBABA: ${{ secrets.TRIBE_API_KEY_ALIBABA }}
        run: |
          set -euo pipefail
          if [ "$THEN_NOW" = "yes" ]; then
            # THE WATCHING FILM (page §5ac): the same pinned game twice, your hands coming into this season and your
            # hands now, everything else held still. Scripted dink hands rather than the members' own engines, on
            # purpose: the point of the film is that the only thing changing between the halves is reach, and a
            # different shot selection in each half would be a second cause with a nicer name.
            args=(--then-now "$PERSON" --names "$NAMES" --season "$SEASON" --surface "$SURFACE" --level dink
                  --film "games/pickleball/records/$SEASON-then-now.json"
                  --page "games/pickleball/replays/$SEASON-then-now.html"
                  --note "played by the engine's scripted dink hands; the halves differ only in $PERSON's practice, as the season records it")
          else
            args=(--person-shot "$SHOT" --names "$NAMES" --season "$SEASON" --game "$GAMES" --surface "$SURFACE"
                  --film "games/pickleball/records/$SEASON-game-1.json"
                  --page "games/pickleball/replays/$SEASON-game-1.html")
          fi
          [ -n "$CLOCK" ] && args+=(--clock "$CLOCK")
          true
          # No vendor flag and no practice flag: each member's engine is in its own voice.md, and the balls each one
          # has already hit are in the season file. One source for each, and neither is a form field.
          python3 lab/pickleball.py "${args[@]}" | tee /tmp/session.txt

      - name: What the season says now
        if: always()
        env:
          SEASON: ${{ inputs.season }}
        run: |
          set -euo pipefail
          python3 lab/pickleball.py --report "$SEASON" | tee /tmp/report.txt || true
          {
            echo "## ${SEASON} — after tonight"
            echo
            cat /tmp/report.txt 2>/dev/null || echo "(no report)"
            echo
            echo "<details><summary>the session itself</summary>"
            echo
            echo '```'
            tail -60 /tmp/session.txt 2>/dev/null || echo "(nothing was played)"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the session in the record
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Kythe"
          git config user.email "tribe@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "pickleball: a session in ${{ inputs.season }}"
          git pull -q --rebase || true
          git push -q || { git pull -q --rebase; git push -q; }
