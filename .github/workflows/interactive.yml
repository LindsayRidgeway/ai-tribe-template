name: interactive

# The fast loop: a human knocks, a member answers in the same place, in about twenty seconds.
# The clock (clock.yml) is the slow loop — members writing to each other between your visits.
# Neither replaces the other: one is for being answered, one is for a record that grows.

on:
  issue_comment:
    types: [created]
  # A static page on GitHub Pages cannot post a comment, but it can open an issue: that is the whole reason
  # this trigger exists. chat-static.html prefills the body with `@tribe <name>: <question>`, the person taps
  # Submit, and the answer lands in the thread they are already looking at.
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      question:
        description: "ask a member a question without commenting (blank = wait for a comment)"
        required: false
        default: ""
      member:
        # A text box, and this was a select until 2026-11-04 — the reason it is not one is worth keeping.
        # A `choice` list of member names lives in a workflow file, and GITHUB_TOKEN is not allowed to write
        # workflow files ("refusing to allow a GitHub App to create or update workflow ... without `workflows`
        # permission"), so the workflow that adds a member could never update the list that offers it.
        # A list that only a human with a terminal can keep true is the wrong list. The generated drop list is
        # `members.json`, which the page reads; this form takes a name, and blank means the first on the shelf.
        description: "which member answers — blank means the first on the shelf"
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  answer:
    # A gate, so a busy issue does not wake a model on every passing remark — and so a game command
    # is not also answered as a question by a fourth voice. The game (play.yml) owns three verbs;
    # everything else addressed to @tribe is a question and lands here.
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.question != '') ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@tribe')) ||
      (contains(github.event.comment.body, '@tribe') &&
      !contains(github.event.comment.body, '@tribe draft') &&
      !contains(github.event.comment.body, '@tribe score') &&
      !contains(github.event.comment.body, '@tribe override') &&
      !contains(github.event.comment.body, '@tribe ask') &&
      !contains(github.event.comment.body, '@tribe work') &&
      !contains(github.event.comment.body, '@tribe wake'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One knock at a time: two answers arriving together both rewrite the same member's state, and the
    # second push lands on a file the first has already replaced.
    concurrency:
      group: interactive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Work from the branch as it is now
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME:-main}"
          git fetch --depth=1 origin "$ref"
          git reset --hard "origin/$ref"
          git log --oneline -1

      - name: Which member answers
        # A comment names no member, and this step used to fall back to "b" — a fixture name from the bench
        # that exists in no colony. On 2026-11-04 the founder asked a question from a phone and the reply
        # never came, because greet-the-first-member was never the default: a shipped workflow whose default
        # member does not exist is broken in exactly the case a stranger meets first.
        run: |
          set -euo pipefail
          who="${{ inputs.member }}"
          if [ -z "$who" ]; then
            # The first real member, not the first folder: the test members (a, b, c …) are on the shelf and in
            # `lab/fixtures.txt`, and waking one of them answers a stranger with a being that was never theirs.
            who="$(ls -1 wake/members | while read -r m; do
                     grep -qx "$m" lab/fixtures.txt 2>/dev/null || echo "$m"; done | head -1)"
            echo "no member named in this comment, so the first on the shelf answers: $who"
          fi
          if [ ! -d "wake/members/$who/state" ]; then
            echo "!! no such member: $who (members: $(ls -1 wake/members | tr '\n' ' '))"
            exit 2
          fi
          echo "MEMBER=$who" >> "$GITHUB_ENV"

      - name: The question, as the human wrote it
        env:
          BODY: ${{ github.event.comment.body || github.event.issue.body }}
          ASKED: ${{ inputs.question }}
        run: |
          set -euo pipefail
          printf '%s' "${ASKED:-$BODY}" > /tmp/raw-question.txt
          sed -n 's/.*@tribe[[:space:]]\{1,\}\([A-Za-z][A-Za-z0-9_-]*\).*/\1/p' /tmp/raw-question.txt \
            | head -1 > /tmp/named.txt || true
          sed 's/@tribe[[:space:]]\{1,\}[A-Za-z][A-Za-z0-9_-]*//; s/@tribe//g' /tmp/raw-question.txt \
            > /tmp/question.txt
          echo "--- question ---"; cat /tmp/question.txt
          echo "--- names ---"; cat /tmp/named.txt

      - name: One member answers
        env:
          TRIBE_API_KEY_DEEPSEEK: ${{ secrets.TRIBE_API_KEY_DEEPSEEK }}
          TRIBE_API_KEY_GEMINI: ${{ secrets.TRIBE_API_KEY_GEMINI }}
          TRIBE_API_KEY_QWEN: ${{ secrets.TRIBE_API_KEY_QWEN }}
          ASK: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          touch /tmp/answer-start      # so the next step cannot hand back last week's answer
          Q="$(cat /tmp/question.txt)"
          who="${MEMBER:?no member was chosen}"
          # If the question names a member on the shelf, that member answers. This is how the
          # static page's prefilled `@tribe Colette: …` reaches the right seat instead of the first one.
          named="$(cat /tmp/named.txt 2>/dev/null || true)"
          if [ -n "$named" ] && [ -d "wake/members/$named/state" ]; then
            echo "the question names $named, so $named answers"
            who="$named"
          elif [ -n "$named" ]; then
            echo "!! the question names $named, who is not on the shelf; ${MEMBER} answers instead"
          fi
          api="$(grep -E '^api:' "wake/members/$who/state/voice.md" | head -1 | awk '{print $2}')"
          model="$(grep -E '^model:' "wake/members/$who/state/voice.md" | head -1 | awk '{print $2}')"
          echo "MEMBER=$who" >> "$GITHUB_ENV"
          python3 wake/wake.py --api-model "$model" --api-base "$api" \
            --member "$who" --ask "$Q" 2>&1 | tee /tmp/answer.log
          grep -E "^=== verdict" /tmp/answer.log | tail -1

      - name: Answer in the same place the question was asked
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          who="${MEMBER:?no member was chosen}"
          # This wake's answer, not the newest file in the directory. A wake that failed to write one
          # leaves the previous answer sitting there, and posting it under this question's stamp is the
          # harness putting words in a member's mouth.
          f="$(ls -t "wake/members/$who/output"/*.md 2>/dev/null | head -1 || true)"
          if [ -z "$f" ] || { [ -f /tmp/answer-start ] && [ ! "$f" -nt /tmp/answer-start ]; }; then
            echo "!! $who left no answer file this wake — nothing is posted, and the transcript has why"
            echo "   (the question is still answered in the run log above)"
            exit 0
          fi
          {
            echo "**${f##*/}** — member ${who^}, ${{ github.actor }}, $(date -u +%FT%TZ)"
            echo
            cat "$f"
          } > /tmp/reply.md
          if [ -n "${ISSUE:-}" ]; then
            gh api "repos/${{ github.repository }}/issues/${ISSUE}/comments" -F body=@/tmp/reply.md > /dev/null
            echo "reply posted to issue ${ISSUE}"
          else
            # A dispatched question had no thread, so its answer lived only in the run log — three taps
            # deep on a phone, in a page that reloads. Open a thread and answer in it, so the phone path
            # ends somewhere a person can read and reply to.
            q="$(head -c 80 /tmp/question.txt 2>/dev/null || echo 'a question')"
            num="$(gh api "repos/${{ github.repository }}/issues" \
                     -f title="Ask ${who}: ${q}" \
                     -f body="Asked from the Run-workflow form by ${{ github.actor }} at $(date -u +%FT%TZ)." \
                     --jq .number)"
            echo "opened issue ${num} for this question"
            gh api "repos/${{ github.repository }}/issues/${num}/comments" -F body=@/tmp/reply.md > /dev/null
            echo "reply posted to issue ${num}"
          fi

      # The answer reached the issue thread and stopped there: the member's own output directory is not
      # the shelf, so the magazine never printed a single answer to a human's question, and the derived
      # files fell out of step with the record — `lab/derivable.py` said so on 2026-11-03, after a knock
      # gave B a reading that LEDGER.md never counted. Filing is the hinge; the rebuild is the rest of it.
      - name: File the answer, so the shelf and the magazine can see it
        env:
          MEMBER: ${{ env.MEMBER }}
        run: |
          set -euo pipefail
          m="${MEMBER:?no member was chosen}"
          if [ ! -f /tmp/answer-start ]; then echo "the answer step never started — nothing to file"; exit 0; fi
          newest="$(ls -t "wake/members/$m/output"/raw-*.json 2>/dev/null | head -1 || true)"
          if [ -z "$newest" ] || [ ! "$newest" -nt /tmp/answer-start ]; then
            echo "$m: this answer left no raw reply — nothing to file"; exit 0; fi
          issue="$(python3 magazine.py --current)"
          python3 file_work.py --member "$m" --issue "$issue" --raw "$newest" || \
            echo "!! $m: filing failed — the reply is still in $newest and the answer stands in the thread"

      - name: Rebuild what is derived from it
        run: |
          set -euo pipefail
          issue="$(python3 magazine.py --current)"
          python3 magazine.py --issue "$issue" --write > /dev/null || echo "!! the magazine did not rebuild"
          python3 magazine.py --projects --write > /dev/null || true
          python3 magazine.py --index --write > /dev/null || true
          python3 magazine.py --ledger --write > /dev/null || true

      - name: Keep the exchange in the record
        if: always()
        env:
          MEMBER: ${{ env.MEMBER }}
        run: |
          set -euo pipefail
          git config user.name "Model AI Tribe"
          git config user.email "tribe@users.noreply.github.com"
          m="${MEMBER:?no member was chosen}"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "interactive: a human knocked, member ${m} answered"
            git pull -q --rebase || true
            git push -q || { git pull -q --rebase; git push -q; }
          fi

      - name: Keep the transcript whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-transcript
          path: /tmp/answer.log
